name: Build & Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:

  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller poe_overlay.spec

      - name: Upload exe to release
        run: gh release upload ${{ github.event.release.tag_name }} dist/poe_overlay.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter + PyInstaller
        run: |
          sudo apt-get install -y python3-tk
          pip install pyinstaller

      - name: Build ELF binary
        run: pyinstaller poe_overlay.spec

      - name: Upload ELF to release
        run: gh release upload ${{ github.event.release.tag_name }} dist/poe_overlay --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
